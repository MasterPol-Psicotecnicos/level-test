<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de nivel MasterPol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: una sola columna de papel, como las páginas de los dossieres; bloques de color por nivel. Diseño claro deliberado (papel impreso). */
:root {
  --paper: #FFFDF8;
  --cream: #F4F1EA;
  --line: #D9D4C7;
  --navy: #1B2A4A;
  --ink-soft: #4A5570;
  --orange: #EE7B22;
  --orange-ink: #B4500F;
  --yellow: #F2C14E;
  --yellow-soft: #FBEFC9;
  --blue: #3C6FB4;
  --white: #FFFFFF;
  --ok: #2E7D4F;
  --ok-soft: #E3F1E8;
  --bad-soft: #FCEBDD;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--navy); font-family: var(--font); font-size: 18px; line-height: 1.55; }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { height: 38px; width: auto; display: block; }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: var(--ink-soft); text-transform: uppercase; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

/* ---------- inicio ---------- */
.hero { display: flex; flex-direction: column; gap: 18px; border-bottom: 6px solid var(--navy); padding-bottom: 26px; }
.hero h1 { font-size: clamp(56px, 13vw, 112px); font-weight: 900; line-height: .85; letter-spacing: -0.045em; }
.hero h1 span { display: block; color: var(--orange); }
.hero p.lead { font-size: 20px; max-width: 34em; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lv { padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 132px; }
.lv b { font-size: 40px; font-weight: 900; line-height: .9; letter-spacing: -1px; }
.lv span { font-size: 15px; font-weight: 700; line-height: 1.25; }
.lv small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .85; margin-top: 4px; }
.c-A1 { background: var(--navy); color: var(--white); }
.c-A2 { background: var(--orange); color: var(--navy); }
.c-B1 { background: var(--yellow); color: var(--navy); }
.c-B2 { background: var(--blue); color: var(--white); }
.how { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.how div { display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--navy); padding-top: 12px; font-size: 16px; }
.how h3 { font-size: 17px; font-weight: 800; }
.start { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; background: var(--cream); padding: 20px; }
.start label { display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px; font-size: 14px; font-weight: 700; }
.start input { font: inherit; font-size: 18px; padding: 12px 14px; border: 2px solid var(--line); background: var(--white); color: var(--navy); border-radius: 0; }
.start input:focus { border-color: var(--navy); outline: none; }
.btn { appearance: none; border: 0; cursor: pointer; font-size: 18px; font-weight: 800; padding: 14px 26px; background: var(--navy); color: var(--white); letter-spacing: .2px; }
.btn:hover { background: #26395F; }
.btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--navy); border: 2px solid var(--navy); padding: 12px 22px; }
.btn.ghost:hover { background: var(--cream); }

/* ---------- pregunta ---------- */
.progress { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seg { height: 10px; background: var(--cream); position: relative; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .3s; }
.seg.A1 i { background: var(--navy); } .seg.A2 i { background: var(--orange); } .seg.B1 i { background: var(--yellow); } .seg.B2 i { background: var(--blue); }
.seglbl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--ink-soft); margin-top: 6px; }
.qhead { display: flex; align-items: flex-end; gap: 20px; border-bottom: 6px solid var(--acc); padding-bottom: 18px; }
.qnum { font-size: 104px; font-weight: 900; line-height: .75; letter-spacing: -6px; color: var(--acc); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.qhead .kicker { color: var(--navy); }
.qhead h2 { font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 6px; }
.sentence { font-size: clamp(24px, 5vw, 32px); font-weight: 800; line-height: 1.25; letter-spacing: -0.5px; }
.sentence .gap { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--acc); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { appearance: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 16px 18px; background: var(--white); border: 2px solid var(--line); color: var(--navy); font-size: 20px; font-weight: 600; line-height: 1.3; }
.opt .k { flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--navy); font-size: 15px; font-weight: 900; }
.opt:hover { border-color: var(--navy); }
.opt[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--white); }
.opt[aria-pressed="true"] .k { background: var(--paper); border-color: var(--paper); color: var(--navy); }
.opt.idk { background: transparent; border-style: dashed; font-size: 17px; color: var(--ink-soft); }
.opt.idk[aria-pressed="true"] { background: var(--cream); color: var(--navy); border-style: solid; }
.opt.idk .k { border-style: dashed; border-color: var(--ink-soft); }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 15px; color: var(--ink-soft); }
kbd { display: inline-block; min-width: 1.7em; padding: 1px 6px; border: 1.5px solid var(--navy); border-bottom-width: 3px; background: var(--white); color: var(--navy); font: 800 13px/1.4 var(--font); text-align: center; }
@media (hover: none) { .kb { display: none; } }

/* ---------- pausa entre partes ---------- */
.pause { display: flex; flex-direction: column; gap: 18px; padding: 28px; background: var(--acc); color: var(--accon); }
.pause h2 { font-size: clamp(32px, 7vw, 48px); font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
.pause p { font-size: 19px; max-width: 32em; }
.pause .btn { align-self: flex-start; background: var(--navy); color: var(--white); }
.pause.dark .btn { background: var(--paper); color: var(--navy); }

/* ---------- resultado ---------- */
.res-head { display: flex; flex-direction: column; gap: 10px; border-bottom: 6px solid var(--navy); padding-bottom: 20px; }
.res-head h2 { font-size: clamp(40px, 9vw, 64px); font-weight: 900; letter-spacing: -2px; line-height: .95; }
.verdict { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.disc { width: 188px; height: 188px; border-radius: 50%; display: grid; place-items: center; font-size: 88px; font-weight: 900; letter-spacing: -4px; flex-shrink: 0; }
.verdict .txt { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.verdict .txt h3 { font-size: clamp(28px, 6vw, 38px); font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
.verdict .txt p { font-size: 19px; }
.soon { align-self: flex-start; background: var(--yellow-soft); font-size: 14px; font-weight: 800; letter-spacing: 1px; padding: 6px 10px; text-transform: uppercase; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--cream); padding: 16px 20px; }
.score b { font-size: 44px; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.score span { font-size: 17px; font-weight: 600; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 56px minmax(0, 1fr) 132px; align-items: center; gap: 14px; }
.bar .tag { font-weight: 900; font-size: 18px; padding: 6px 0; text-align: center; }
.bar .track { height: 18px; background: var(--cream); position: relative; }
.bar .fill { position: absolute; inset: 0 auto 0 0; }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--navy); }
.bar .st { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend { font-size: 14px; color: var(--ink-soft); }
.box { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.box.tip { background: var(--navy); color: var(--white); }
.box.tip .lbl { color: var(--yellow); }
.box.warn { background: var(--white); border: 3px solid var(--orange); }
.box.warn .lbl { color: var(--orange-ink); }
.lbl { font-size: 13px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
.box ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
details { border-top: 3px solid var(--navy); padding-top: 14px; }
summary { cursor: pointer; font-weight: 800; font-size: 19px; }
.review { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.rv { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 12px 14px; font-size: 16px; }
.rv.ok { background: var(--ok-soft); } .rv.no { background: var(--bad-soft); }
.rv .m { font-weight: 900; font-size: 20px; line-height: 1.2; }
.rv.ok .m { color: var(--ok); } .rv.no .m { color: var(--orange-ink); }
.rv .q { font-weight: 700; }
.rv .a { color: var(--ink-soft); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.sent { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--cream); font-size: 18px; font-weight: 700; }
.sent .ic { width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; background: var(--navy); color: var(--white); font-weight: 900; }
.sent.ok { background: var(--ok-soft); } .sent.ok .ic { background: var(--ok); }
.sent.no { background: var(--bad-soft); } .sent.no .ic { background: var(--orange-ink); }
.send { display: flex; flex-direction: column; gap: 12px; background: var(--cream); padding: 18px 20px; }
.send h3 { font-size: 19px; font-weight: 800; }
.send p { font-size: 16px; }
.send .st { font-size: 15px; font-weight: 700; }
.send .st.ok { color: var(--ok); } .send .st.no { color: var(--orange-ink); }
.copybox { width: 100%; min-height: 150px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 10px; border: 2px solid var(--line); background: var(--white); color: var(--navy); }
.foot { font-size: 13px; color: var(--ink-soft); border-top: 3px solid var(--navy); padding-top: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 600; }

@media (max-width: 640px) {
  .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .how { grid-template-columns: 1fr; }
  .qnum { font-size: 72px; letter-spacing: -4px; }
  .disc { width: 132px; height: 132px; font-size: 62px; }
  .bar { grid-template-columns: 44px minmax(0, 1fr); }
  .bar .st { grid-column: 2; }
  .logo { height: 30px; }
  .top .kicker { display: none; }
}
@media (prefers-reduced-motion: reduce) { .seg i { transition: none; } }
</style>
</head>

    { q: "Las llaves están aquí, en tu mano. ¿Cómo dices «Estas son mis llaves»?", s: "___ are my keys.", o: ["This", "These", "Those", "That"], c: 1, t: "Lección 4 · this, these, that, those" },
    { q: "Hablas de Carmen y de su marido. Completa.", s: "Carmen and ___ husband.", o: ["his", "her", "their", "she"], c: 1, t: "Lección 5 · Los posesivos" },
    { q: "¿Cómo se dice «No entiendo»?", s: "", o: ["I don't understand.", "I not understand.", "I no understand.", "I don't understanding."], c: 0, t: "Lección 6 · don't" },
    { q: "¿Cómo se dice «¿Puedes ayudarme?»?", s: "", o: ["Can you help me?", "Can help you me?", "You can help me?", "Do you can help me?"], c: 0, t: "Lección 6 · Pedir con can" }
  ],
  A2: [
    { q: "Completa con el presente simple.", s: "My husband ___ TV every evening.", o: ["watch", "watches", "watching", "is watch"], c: 1, t: "Lección 1 · La -s de he, she, it" },
    { q: "Completa la pregunta.", s: "___ she work on Saturdays?", o: ["Do", "Does", "Is", "Are"], c: 1, t: "Lección 1 · Preguntas con do / does" },
    { q: "Está pasando ahora mismo. Completa.", s: "Look! It ___.", o: ["rains", "is raining", "rain", "raining"], c: 1, t: "Lección 2 · El presente continuo" },
    { q: "Completa.", s: "There ___ two banks in the square.", o: ["is", "are", "be", "am"], c: 1, t: "Lección 3 · There is / there are" },
    { q: "Completa la pregunta.", s: "Is there ___ milk in the fridge?", o: ["some", "any", "a", "many"], c: 1, t: "Lección 3 · some / any" },
    { q: "Completa con el pasado.", s: "Yesterday I ___ to the market.", o: ["go", "went", "goed", "gone"], c: 1, t: "Lección 5 · Verbos irregulares" },
    { q: "¿Qué frase está bien?", s: "", o: ["We didn't see the film.", "We didn't saw the film.", "We not saw the film.", "We don't saw the film."], c: 0, t: "Lección 5 · La negativa con didn't" },
    { q: "Completa la comparación.", s: "My son is ___ than me.", o: ["tall", "taller", "more tall", "tallest"], c: 1, t: "Lección 6 · Comparativos" },
    { q: "Es un plan ya decidido. Completa.", s: "Next summer we ___ travel to Italy.", o: ["are going to", "going", "will to", "go"], c: 0, t: "Lección 7 · be going to" },
    { q: "Completa con la preposición.", s: "I was born ___ 1958.", o: ["in", "on", "at", "for"], c: 0, t: "Lección 8 · in, on, at" }
  ],
  B1: [
    { q: "Completa la pregunta.", s: "Have you ever ___ to London?", o: ["went", "been", "go", "going"], c: 1, t: "Lección 1 · Presente perfecto: ever / been" },
    { q: "Completa.", s: "I have lived here ___ 1985.", o: ["for", "since", "ago", "during"], c: 1, t: "Lección 2 · for / since" },
    { q: "¿Cómo se dice «Me casé hace cuarenta años»?", s: "", o: ["I got married forty years ago.", "I have got married forty years ago.", "I got married since forty years.", "I married since forty years ago."], c: 0, t: "Lección 2 · ago y pasado simple" },
    { q: "Completa con el pasado continuo.", s: "I ___ cooking when the phone rang.", o: ["was", "were", "am", "did"], c: 0, t: "Lección 3 · El pasado continuo" },
    { q: "Es una costumbre que ya no tienes. Completa.", s: "When I was a child, I ___ play in the street.", o: ["use to", "used to", "was use", "using to"], c: 1, t: "Lección 4 · used to" },
    { q: "Completa.", s: "I really enjoy ___.", o: ["cook", "to cook", "cooking", "cooked"], c: 2, t: "Lección 4 · Verbos con -ing o con to" },
    { q: "Es domingo: no hace falta madrugar. Completa.", s: "You ___ get up early.", o: ["mustn't", "don't have to", "shouldn't", "can't"], c: 1, t: "Lección 5 · mustn't / don't have to" },
    { q: "Completa la condición.", s: "If it ___ tomorrow, we'll stay at home.", o: ["rains", "will rain", "rained", "would rain"], c: 0, t: "Lección 6 · Las frases con if" },
    { q: "Completa con la pasiva.", s: "This church ___ in 1750.", o: ["built", "was built", "is build", "has build"], c: 1, t: "Lección 7 · La voz pasiva" },
    { q: "Completa.", s: "She ___ me that she was tired.", o: ["said", "told", "asked", "spoke"], c: 1, t: "Lección 8 · say / tell" }
  ],
  B2: [
    { q: "Una acción pasó antes que otra. Completa.", s: "When I arrived, the train ___.", o: ["had already left", "has already left", "already leaves", "was already leave"], c: 0, t: "El pasado perfecto" },
    { q: "Completa (algo que no pasó).", s: "If I had known, I ___ you.", o: ["would have called", "would call", "had called", "will call"], c: 0, t: "El tercer condicional" },
    { q: "Completa el deseo.", s: "I wish I ___ more free time.", o: ["have", "had", "would have", "am having"], c: 1, t: "wish + pasado" },
    { q: "Estás casi seguro de que es así. Completa.", s: "She isn't answering. She ___ be busy.", o: ["must", "can't", "should", "mustn't"], c: 0, t: "Deducción: must / can't" },
    { q: "Estás seguro de que no fue él. Completa.", s: "He ___ have taken it. He was with me all day.", o: ["mustn't", "can't", "shouldn't", "doesn't"], c: 1, t: "Deducción en pasado" },
    { q: "Completa con la pasiva.", s: "My car ___ repaired at the moment.", o: ["is being", "is been", "has being", "being"], c: 0, t: "La pasiva en continuo" },
    { q: "Completa la pregunta en estilo indirecto.", s: "She asked me where ___.", o: ["did I live", "I lived", "do I live", "lived I"], c: 1, t: "Preguntas en estilo indirecto" },
    { q: "Completa con el conector.", s: "___ it was raining, we went for a walk.", o: ["Despite", "Although", "However", "Because"], c: 1, t: "Conectores de contraste" },
    { q: "Completa.", s: "My sister, ___ lives in London, is a doctor.", o: ["that", "who", "which", "whose"], c: 1, t: "Oraciones de relativo explicativas" },
    { q: "Completa.", s: "I'm not used to ___ up so early.", o: ["get", "getting", "got", "gets"], c: 1, t: "be used to + -ing" }
  ]
};

/* ---------- estado ---------- */
let S = null;
const app = document.getElementById("app");
const esc = (t) => String(t).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
function nuevo(nombre) { return { nombre: nombre.trim(), nivel: 0, i: 0, resp: { A1: [], A2: [], B1: [], B2: [] }, fin: false }; }
function aciertos(lv) { return S.resp[lv].filter((r, k) => r === PREGUNTAS[lv][k].c).length; }
function acc(lv) { app.style.setProperty("--acc", COLOR[lv][0]); app.style.setProperty("--accon", COLOR[lv][1]); }
function subir() { window.scrollTo({ top: 0, behavior: "auto" }); }

/* ---------- pantallas ---------- */
function inicio() {
  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:28px">
    <div class="hero">
      <div class="kicker">¿Por qué dossier empiezo?</div>
      <h1>Test de<span>nivel</span></h1>
    </div>
    <div class="levels" aria-label="Los cuatro dossieres">
      ${NIVELES.map((lv) => `<div class="lv c-${lv}"><b>${lv}</b><span>${esc(DOSSIER[lv].lema)}<small>${DOSSIER[lv].disponible ? "Dossier disponible" : "Próximamente"}</small></span></div>`).join("")}
    </div>
    <div class="how">
      <div><h3>Recomendación</h3><p>Si no sabes una respuesta, pulsa <strong>«No lo sé»</strong>. Así el resultado será más fiable.</p></div>
    </div>
    <form class="start" id="f">
      <label for="nombre">Tu nombre y apellidos<input id="nombre" name="nombre" autocomplete="name" placeholder="Por ejemplo, Carmen López" required></label>
      <button class="btn" type="submit">Empezar el test</button>
    </form>
    <p class="hint">Tardarás entre 5 y 15 minutos, según hasta dónde llegues.</p>
  </section>`;
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); const n = document.getElementById("nombre"); if (!n.value.trim()) { n.value = ""; n.reportValidity(); n.focus(); return; } S = nuevo(n.value); pregunta(); });
}

function progreso() {
  return `<div><div class="progress">${NIVELES.map((lv, n) => {
    const w = n < S.nivel ? 100 : n === S.nivel ? (S.i / 10) * 100 : 0;
    return `<div class="seg ${lv}"><i style="width:${w}%"></i></div>`;
  }).join("")}</div><div class="seglbl">${NIVELES.map((lv) => `<span>${lv}</span>`).join("")}</div></div>`;
}

function pregunta() {
  const lv = NIVELES[S.nivel], P = PREGUNTAS[lv][S.i], sel = S.resp[lv][S.i];
  acc(lv);
  const frase = P.s ? `<p class="sentence">${esc(P.s).replace("___", '<span class="gap" aria-label="hueco"></span>')}</p>` : "";
  const letras = ["A", "B", "C", "D"];
  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:26px">
    ${progreso()}
    <div class="qhead">
      <div class="qnum" aria-hidden="true">${S.i + 1}</div>
      <div><div class="kicker">Parte ${S.nivel + 1} de 4 · Nivel ${lv} · Pregunta ${S.i + 1} de 10</div><h2>${esc(P.q)}</h2></div>
    </div>
    ${frase}
    <div class="opts" role="group" aria-label="Respuestas">
      ${P.o.map((t, k) => `<button class="opt" type="button" data-k="${k}" aria-pressed="${sel === k}"><span class="k">${letras[k]}</span>${esc(t)}</button>`).join("")}
      <button class="opt idk" type="button" data-k="-1" aria-pressed="${sel === -1}"><span class="k">?</span>No lo sé</button>
    </div>
    <p class="hint kb">Con el teclado: pulsa <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> para elegir, <kbd>N</kbd> para «No lo sé» y <kbd>Intro</kbd> para seguir.</p>
    <div class="nav">
      <button class="btn ghost" type="button" id="prev" ${S.i === 0 ? "hidden" : ""}>Anterior</button>
      <span class="hint" id="h">${sel === undefined ? "Elige una respuesta para seguir." : ""}</span>
      <button class="btn" type="button" id="next" ${sel === undefined ? "disabled" : ""}>${S.i === 9 ? "Terminar esta parte" : "Siguiente"}</button>
    </div>
  </section>`;
  app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
    S.resp[lv][S.i] = Number(b.dataset.k);
    app.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-pressed", x === b));
    document.getElementById("next").disabled = false;
    document.getElementById("h").textContent = "";
  }));
  document.getElementById("prev").addEventListener("click", () => { S.i--; pregunta(); });
  document.getElementById("next").addEventListener("click", () => {
    if (S.i < 9) { S.i++; pregunta(); subir(); return; }
    finParte();
  });
}

function finParte() {
  const lv = NIVELES[S.nivel], a = aciertos(lv);
  if (a < APROBADO || S.nivel === 3) { S.fin = true; resultado(); subir(); return; }
  const sig = NIVELES[S.nivel + 1];
  acc(sig);
  const oscuro = COLOR[sig][1] === "#FFFFFF";
  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:26px">
    ${progreso()}
    <div class="pause ${oscuro ? "dark" : ""}">
      <div class="lbl">Parte ${S.nivel + 1} superada · ${a} de 10</div>
      <h2>¡Muy bien! El ${lv} lo tienes.</h2>
      <p>Ahora vienen diez preguntas de nivel <strong>${sig}</strong>. Serán un poco más difíciles: tómate tu tiempo y, si no sabes alguna, pulsa «No lo sé».</p>
      <button class="btn" type="button" id="go">Seguir con el ${sig}</button>
    </div>
  </section>`;
  document.getElementById("go").addEventListener("click", () => { S.nivel++; S.i = 0; pregunta(); subir(); });
}

function resultado() {
  const hechos = NIVELES.filter((lv) => S.resp[lv].length === 10);
  const ultimo = hechos[hechos.length - 1], aU = aciertos(ultimo);
  const todo = ultimo === "B2" && aU >= APROBADO;
  const rec = ultimo; // el nivel en el que se ha parado (o B2 si lo ha superado todo)
  const D = DOSSIER[rec], total = hechos.reduce((n, lv) => n + aciertos(lv), 0);
  acc(rec);
  const quien = S.nombre ? `${esc(S.nombre)}, ` : "";
  let titulo, texto;
  if (todo) {
    titulo = "¡Tienes nivel B2!";
    texto = `Has superado las cuatro partes. Usa el <strong>dossier ${D.nombre.replace("Inglés ", "")}</strong> para repasar y afianzar, sobre todo lo que hayas fallado.`;
  } else if (rec === "A1" && aU < 4) {
    titulo = `Empieza por el ${D.nombre}`;
    texto = "Es el punto de partida perfecto: el dossier empieza desde cero, sin dar nada por sabido.";
  } else if (aU >= 4) {
    titulo = `Empieza por el ${D.nombre}`;
    texto = `Ya tienes una base del ${rec}, pero todavía no está firme. Trabaja el dossier entero; las lecciones que ya conoces te irán muy rápido.`;
  } else {
    titulo = `Empieza por el ${D.nombre}`;
    texto = `El nivel anterior lo dominas. El ${rec} es tu siguiente paso: empieza por la primera lección.`;
  }
  const fallos = hechos.flatMap((lv) => PREGUNTAS[lv].map((P, k) => ({ lv, P, r: S.resp[lv][k] })).filter((x) => x.r !== x.P.c));
  const repasoRec = [...new Set(fallos.filter((x) => x.lv === rec).map((x) => x.P.t))];
  const repasoPrev = [...new Set(fallos.filter((x) => x.lv !== rec).map((x) => `${x.lv} · ${x.P.t}`))];

  app.innerHTML = `
  <section style="display:flex;flex-direction:column;gap:28px">
    <div class="res-head">
      <div class="kicker">${quien}este es tu resultado</div>
      <h2>Tu dossier</h2>
    </div>
    <div class="verdict">
      <div class="disc" style="background:${COLOR[rec][0]};color:${COLOR[rec][1]}">${rec}</div>
      <div class="txt">
        <h3>${titulo}</h3>
        <p>${texto}</p>
        <p style="font-size:16px;color:var(--ink-soft)">${esc(D.temas)}</p>
        ${D.disponible ? "" : `<span class="soon">El dossier ${rec} estará disponible muy pronto</span>`}
      </div>
    </div>
    ${ENVIO_URL ? `<div class="sent" id="sent" role="status"><span class="ic" aria-hidden="true">…</span><span id="senttxt">Enviando tu resultado a tu profesor…</span></div>` : ""}
    <div class="score"><b>${total}</b><span>puntos de ${hechos.length * 10} posibles en ${hechos.length === 1 ? "la parte que has hecho" : `las ${hechos.length} partes que has hecho`}</span></div>
    <div class="bars" aria-label="Aciertos por nivel">
      ${NIVELES.map((lv) => {
        const hecho = S.resp[lv].length === 10, a = hecho ? aciertos(lv) : 0;
        const st = !hecho ? "No hace falta todavía" : a >= APROBADO ? `${a}/10 · superado` : `${a}/10 · a trabajar`;
        return `<div class="bar"><span class="tag" style="background:${COLOR[lv][0]};color:${COLOR[lv][1]}">${lv}</span>
          <div class="track">${hecho ? `<span class="fill" style="width:${a * 10}%;background:${COLOR[lv][0]}"></span>` : ""}<span class="tick" style="left:${APROBADO * 10}%"></span></div>
          <span class="st">${st}</span></div>`;
      }).join("")}
      <p class="legend">La raya marca el aprobado de cada parte: ${APROBADO} aciertos de 10.</p>
    </div>
    ${repasoRec.length ? `<div class="box tip"><div class="lbl">Fíjate especialmente en</div><ul>${repasoRec.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    ${repasoPrev.length ? `<div class="box warn"><div class="lbl">Repasa también</div><p style="font-size:16px">Estas preguntas son de niveles que has superado, pero conviene darles un repaso:</p><ul>${repasoPrev.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <details>
      <summary>Ver mis respuestas</summary>
      <div class="review">
        ${hechos.flatMap((lv) => PREGUNTAS[lv].map((P, k) => {
          const r = S.resp[lv][k], ok = r === P.c;
          const tuya = r === -1 ? "No lo sé" : P.o[r];
          const fr = P.s ? P.s.replace("___", "____") : P.q;
          return `<div class="rv ${ok ? "ok" : "no"}"><span class="m" aria-label="${ok ? "Correcta" : "Incorrecta"}">${ok ? "✓" : "✗"}</span>
            <div><div class="q">${lv} · ${k + 1}. ${esc(fr)}</div>
            <div class="a">${ok ? `Tu respuesta: ${esc(tuya)}` : `Tu respuesta: ${esc(tuya)} · Correcta: <strong>${esc(P.o[P.c])}</strong>`}</div></div></div>`;
        })).join("")}
      </div>
    </details>
    <div class="actions"><button class="btn ghost" type="button" id="again">Volver a hacer el test</button></div>
  </section>`;
  document.getElementById("again").addEventListener("click", () => { inicio(); subir(); });
  const resumen = informe(hechos, rec, total, todo, repasoRec, repasoPrev);
  if (ENVIO_URL && !S.enviado) enviar(resumen.datos);
}

function informe(hechos, rec, total, todo, repasoRec, repasoPrev) {
  const fecha = new Date();
  const fechaTxt = fecha.toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" });
  const nota = (lv) => (S.resp[lv].length === 10 ? `${aciertos(lv)}/10` : "");
  const recTxt = todo ? "Nivel B2 conseguido (dossier B2 para repasar)" : DOSSIER[rec].nombre;
  const repasar = [...repasoRec.map((t) => `${rec} · ${t}`), ...repasoPrev].join("; ");
  const respuestas = hechos.map((lv) => `${lv}: ` + PREGUNTAS[lv].map((P, k) => {
    const r = S.resp[lv][k]; return `${k + 1}${r === P.c ? "✓" : r === -1 ? "?" : "✗"}`;
  }).join(" ")).join(" | ");
  const texto = [
    `Test de nivel de inglés · ${CENTRO}`,
    `Nombre: ${S.nombre || "(sin nombre)"}`,
    `Fecha: ${fechaTxt}`,
    `Dossier recomendado: ${recTxt}`,
    `Puntos: ${total} de ${hechos.length * 10}`,
    NIVELES.map((lv) => `${lv} ${nota(lv) || "—"}`).join(" · "),
    repasar ? `A repasar: ${repasar}` : "Sin fallos",
    `Respuestas: ${respuestas}`
  ].join("\n");
  const datos = { fecha: fecha.toISOString(), nombre: S.nombre, recomendado: recTxt, puntos: total, maximo: hechos.length * 10,
    A1: nota("A1"), A2: nota("A2"), B1: nota("B1"), B2: nota("B2"), repasar, respuestas };
  return { texto, datos };
}

function enviar(datos) {
  /* Envío sin cookies (credentials: "omit"): si el navegador tiene varias cuentas de Google abiertas,
     Google rechaza las peticiones que llevan cookies. Google contesta y el test lee la confirmación. */
  const caja = () => document.getElementById("sent");
  const pinta = (ok) => {
    S.enviado = ok;
    const c = caja(), txt = document.getElementById("senttxt");
    if (!c) return;
    c.className = "sent " + (ok ? "ok" : "no");
    c.querySelector(".ic").textContent = ok ? "✓" : "!";
    txt.textContent = ok ? "Tu resultado se ha enviado a tu profesor."
      : "No se ha podido enviar tu resultado. Haz una captura de esta pantalla y envíasela a tu profesor.";
  };
  const url = ENVIO_URL + "?callback=r&datos=" + encodeURIComponent(JSON.stringify(datos));
  const ctrl = new AbortController();
  const reloj = setTimeout(() => ctrl.abort(), 25000);
  fetch(url, { method: "GET", mode: "cors", credentials: "omit", redirect: "follow", signal: ctrl.signal })
    .then((res) => res.text())
    .then((txt) => {
      clearTimeout(reloj);
      const m = txt.match(/\{[\s\S]*\}/);
      let r = null; try { r = m ? JSON.parse(m[0]) : null; } catch (e) {}
      if (r && r.ok) return pinta(true);
      console.warn("Respuesta de Google:", txt.slice(0, 300));
      pinta(false);
    })
    .catch((err) => {
      clearTimeout(reloj);
      /* La petición puede haber llegado aunque el navegador no deje leer la respuesta:
         no se reenvía para no duplicar filas. */
      console.warn("Sin confirmación de Google:", err);
      pinta(navigator.onLine !== false && err.name !== "AbortError");
    });
}

/* Teclado: A-D (o 1-4) eligen, N o ? = «No lo sé», Intro = siguiente, flecha izquierda = anterior */
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  const k = e.key.toLowerCase();
  const opts = app.querySelectorAll(".opt");
  if (opts.length) {
    const mapa = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
    let b = null;
    if (k in mapa) b = app.querySelector(`.opt[data-k="${mapa[k]}"]`);
    else if (k === "n" || k === "?") b = app.querySelector('.opt[data-k="-1"]');
    if (b) { e.preventDefault(); b.click(); b.focus(); return; }
    if (k === "enter") { const nx = document.getElementById("next"); if (nx && !nx.disabled) { e.preventDefault(); nx.click(); } return; }
    if (k === "arrowleft") { const pv = document.getElementById("prev"); if (pv && !pv.hidden) { e.preventDefault(); pv.click(); } return; }
  } else if (k === "enter") {
    const go = document.getElementById("go");
    if (go) { e.preventDefault(); go.click(); }
  }
});

inicio();
</script>
